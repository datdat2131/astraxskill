# ===== AstraxSkill config =====
max-level: 5
pvp: true            # skill chủ động có đánh được người chơi khác không

# chance: % kích hoạt (kiếm: khi đánh, giáp: khi bị đánh)
# power: sức mạnh, ý nghĩa tuỳ skill (xem ghi chú)
# cooldown: giây hồi chiêu của skill chủ động (chuột phải / shift + chuột phải)
skills:
  FLAME:       # power = số giây thiêu đốt
    chance: 15
    chance-per-level: 5
    power: 4
    power-per-level: 1
    cooldown: 8
  LIGHTNING:   # power = sát thương sét cộng thêm
    chance: 10
    chance-per-level: 4
    power: 4
    power-per-level: 2
    cooldown: 12
  LIFESTEAL:   # power = % sát thương hồi lại thành máu
    chance: 20
    chance-per-level: 5
    power: 15
    power-per-level: 5
    cooldown: 10
  FREEZE:      # power = số giây làm chậm
    chance: 15
    chance-per-level: 5
    power: 3
    power-per-level: 1
    cooldown: 10
  GUARD:       # power = % giảm sát thương
    chance: 15
    chance-per-level: 5
    power: 30
    power-per-level: 10
    cooldown: 20
  REFLECT:     # power = % sát thương phản lại kẻ tấn công
    chance: 15
    chance-per-level: 5
    power: 40
    power-per-level: 10
    cooldown: 15
  REGEN:       # power = lượng máu hồi (1 = nửa tim)
    chance: 12
    chance-per-level: 4
    power: 4
    power-per-level: 2
    cooldown: 25

# ===== SET ĐỒ =====
# tiers: số món đang mặc/cầm cùng set (tối đa 5: 4 giáp + 1 kiếm)
sets:
  astrax:
    name: "&6&lAstrax Huyền Thoại"
    tiers:
      '2':
        effects: ["SPEED:0"]
        damage-bonus: 0.05
        damage-reduction: 0.05
      '4':
        effects: ["RESISTANCE:0", "JUMP_BOOST:1"]
        damage-bonus: 0.10
        damage-reduction: 0.10
      '5':
        effects: ["STRENGTH:0", "REGENERATION:0", "FIRE_RESISTANCE:0"]
        damage-bonus: 0.20
        damage-reduction: 0.15
    # Dùng cho: /astrax give <người chơi> astrax
    items:
      sword:
        material: NETHERITE_SWORD
        name: "&6&lKiếm Astrax"
        enchants: ["sharpness:5", "unbreaking:3", "looting:3", "fire_aspect:2"]
        skills: ["FLAME:3", "LIGHTNING:3", "LIFESTEAL:2"]
      helmet:
        material: NETHERITE_HELMET
        name: "&6&lMũ Astrax"
        enchants: ["protection:4", "unbreaking:3", "respiration:3"]
        skills: ["GUARD:2", "REGEN:1"]
      chestplate:
        material: NETHERITE_CHESTPLATE
        name: "&6&lÁo Giáp Astrax"
        enchants: ["protection:4", "unbreaking:3"]
        skills: ["GUARD:3", "REFLECT:2"]
      leggings:
        material: NETHERITE_LEGGINGS
        name: "&6&lQuần Astrax"
        enchants: ["protection:4", "unbreaking:3"]
        skills: ["REFLECT:2", "REGEN:2"]
      boots:
        material: NETHERITE_BOOTS
        name: "&6&lGiày Astrax"
        enchants: ["protection:4", "unbreaking:3", "feather_falling:4"]
        skills: ["GUARD:1", "REGEN:2"]

# ======================================================
#  ASTRAX - HẮC LONG (kiếm huyền thoại, 3 cấp tiến hóa)
#  Chuột phải = Long Trảm | Phím F = Hắc Long Giáng Thế
#  Nội tại: Long Huyết | Tích đủ năng lượng: Long Nộ
# ======================================================
hac-long:
  material: NETHERITE_SWORD
  enchants: ["sharpness:4", "unbreaking:3", "fire_aspect:1", "looting:3"]

  # Phím dùng Hắc Long Giáng Thế: shift-right-click (Shift + chuột phải) hoặc f (phím F)
  ultimate-key: shift-right-click

  names:
    1: "&4&l☠ ASTRAX • HẮC LONG"
    2: "&4&l☠ ASTRAX • HẮC LONG THỨC TỈNH"
    3: "&4&l☠ ASTRAX • HẮC LONG THẦN DIỆT"

  # CustomModelData cho resource pack / Oraxen (0 = không đổi model).
  # tierX = model bình thường, rageX = model khi Long Nộ (lưỡi sáng đỏ mạnh).
  model-data:
    tier1: 0
    tier2: 0
    tier3: 0
    rage1: 0
    rage2: 0
    rage3: 0

  # ----- Cân bằng PvP -----
  max-damage: 12          # trần sát thương của mọi skill (đã tính giáp, KHÔNG xuyên giáp)
  pvp-multiplier: 0.6     # skill đánh người chơi chỉ còn 60% sát thương
  damage:
    long-tram: [6, 7, 8]  # theo cấp 1/2/3
    giang-the: [8, 10, 12]

  cooldowns:
    long-tram: 10
    giang-the: 45
  long-tram-range: 10
  giang-the:
    reach: 22
    radius: 4

  long-huyet:             # nội tại
    chance: 12            # %
    seconds: 4            # Strength I trong 4 giây
    internal-cooldown: 6

  rage:                   # Long Nộ
    charge-per-hit: 8
    charge-max: 100
    seconds: 10
    damage-bonus: 0.15    # +15% sát thương đánh thường khi Long Nộ

  # Đá nâng cấp: kéo thả đá lên kiếm trong túi đồ. Số đá cần theo cấp hiện tại.
  upgrade-cost:
    1: 1                  # cấp 1 -> 2
    2: 2                  # cấp 2 -> 3
  stone:
    material: NETHER_STAR
    name: "&c&l✦ Đá Nâng Cấp Hắc Long"
    lore:
      - "&7Kéo thả vào &4Kiếm Hắc Long"
      - "&7trong túi đồ để tiến hóa."
      - ""
      - "&4&lCHỈ BÁN TẠI SHOP VIP ASTRAX"

  lore:
    - "&cᴍʏᴛʜɪᴄᴀʟ ᴡᴇᴀᴘᴏɴ"
    - "&8━━━━━━━━━━━━━━━━"
    - "&7Thanh kiếm được tạo ra từ"
    - "&7xương và huyết mạch của Hắc Long."
    - "&7Ngọn lửa đỏ vẫn luôn cháy"
    - "&7bên trong lưỡi kiếm cổ đại."
    - ""
    - "&c☠ &fSức mạnh: &cHuyền thoại"
    - "&c✦ &fHệ: &4Hắc Long"
    - "&c✦ &fĐộ hiếm: &4Mythical"
    - "&c✦ &fTiến hóa: &e{tier_name}"
    - ""
    - "&6✦ KỸ NĂNG"
    - "&c➤ Long Trảm &7(Chuột phải)"
    - "&c➤ Hắc Long Giáng Thế &7(Shift + Chuột phải)"
    - "&c➤ Long Huyết &7(Nội tại)"
    - "&c➤ Long Nộ &7(Tích đủ năng lượng)"
    - "&8━━━━━━━━━━━━━━━━"
    - "&4&lCHỈ CÓ THỂ MUA TẠI SHOP VIP ASTRAX"

# ======================================================
#  CYBER DRAGON - BỘ GIÁP NỘI TẠI (Passive, tự kích hoạt)
#  Chỉ cần mặc giáp. Đủ 4 món mới có 4 kỹ năng bộ.
# ======================================================
cyber-dragon:
  pieces:
    helmet:
      material: NETHERITE_HELMET
      name: "&b&l⚡ Mũ Cyber Dragon"
      enchants: ["protection:4", "unbreaking:3", "respiration:3"]
      model-data: 0
      # Muốn dùng món GIẤY (PAPER) làm mũ: để material: PAPER, hoặc cầm món giấy của bạn gõ
      # /astrax cyber apply helmet (giữ nguyên CustomModelData). Server 1.21.2+ có thể điền
      # equip-model: "namespace:ten_asset" để mũ hiện trên đầu bằng model của resource pack.
      equip-model: ""
    chestplate:
      material: NETHERITE_CHESTPLATE
      name: "&b&l⚡ Giáp Ngực Cyber Dragon"
      enchants: ["protection:4", "unbreaking:3"]
      model-data: 0
    leggings:
      material: NETHERITE_LEGGINGS
      name: "&b&l⚡ Quần Cyber Dragon"
      enchants: ["protection:4", "unbreaking:3"]
      model-data: 0
    boots:
      material: NETHERITE_BOOTS
      name: "&b&l⚡ Giày Cyber Dragon"
      enchants: ["protection:4", "unbreaking:3", "feather_falling:4"]
      model-data: 0

  # Nội tại từng món (chỉ cần mặc món đó, không cần đủ bộ)
  passive:
    helmet-damage: 0.10     # Mũ: +10% sát thương gây ra
    chest-reduction: 0.12   # Giáp ngực: -12% sát thương nhận vào
    legs-speed: 0.15        # Quần: +15% tốc độ di chuyển
    boots-speed: 0.20       # Giày: +20% tốc độ di chuyển

  # Kỹ năng bộ (đủ 4 món). Hồi chiêu tính từ lúc kích hoạt, độc lập từng skill.
  cyber-shield:             # I. phòng thủ
    chance: 15              # % khi nhận sát thương
    reduction: 0.40
    seconds: 4
    cooldown: 45
  overdrive:                # II. tấn công
    health-below: 0.50
    damage-bonus: 0.25
    speed-bonus: 0.20
    seconds: 8
    cooldown: 60
  energy-absorption:        # III. phòng thủ
    chance: 15
    heal-percent: 0.05      # 5% máu tối đa
    cooldown: 15
  ultimate:                 # IV. sinh tồn (thay thế Overdrive nếu đang chạy)
    health-below: 0.20
    reduction: 0.35
    damage-bonus: 0.25
    seconds: 8
    cooldown: 120

  # Trần giảm sát thương tổng (nội tại + Shield + Ultimate cộng dồn nhân nhau)
  max-total-reduction: 0.70

# ======================================================
#  GLOWING - phát sáng để nhận ra người quyền quý
#  Mặc bất kỳ 1 món là sáng, tháo hết là tắt (cập nhật mỗi 0.5 giây)
# ======================================================
glowing:
  enabled: true
  cyber-dragon: true   # mặc bất kỳ 1 món giáp Cyber Dragon
  astrax-set: true     # mặc bất kỳ 1 món giáp thuộc set Astrax (sets.* trong config)

# ======================================================
#  ASTRAX - HẮC LONG EXODUS (kiếm VIP mạnh nhất, 6 kỹ năng bị động)
#  /astrax exodus give <người>
# ======================================================
exodus:
  material: NETHERITE_SWORD
  name: "&4&l⚔ ʜắᴄ ʟᴏɴɢ ᴇxᴏᴅᴜs"
  enchants: ["sharpness:3", "unbreaking:3", "looting:3"]
  slash-fx: true                # hiệu ứng chém mỗi đòn đánh (3 kiểu xoay vòng, chí mạng = chém chữ X)
  model-data:                   # CustomModelData resource pack (0 = không đổi)
    normal: 0
    overlord: 0                 # model khi Overlord đang chạy
  # (tuỳ chọn) đổi model giáp Cyber Dragon khi cộng hưởng: cyber-dragon.pieces.<slot>.pulse-model-data

  # ----- Chỉ số cơ bản -----
  stats:
    damage-bonus: 0.30          # +30% sát thương
    crit-chance: 25             # %
    crit-damage: 0.75           # +75% khi chí mạng
    lifesteal: 0.06             # hút máu 6%
    max-lifesteal-per-hit: 3    # trần hồi máu mỗi đòn (1.5 tim)
    attack-speed: 0.15          # +15% tốc độ đánh khi cầm kiếm

  # ----- Lực chém: đòn đánh có xung lực đẩy lùi nhẹ + sóng chấn dưới chân mục tiêu -----
  impact:
    enabled: true
    knockback: 0.35       # lực đẩy thêm (vanilla ~0.4)
    crit-multiplier: 1.6  # chí mạng đẩy mạnh hơn
    lift: 0.12            # nảy lên nhẹ

  # ----- Cân bằng PvP -----
  max-multiplier: 2.5           # trần sát thương 1 đòn = 2.5x sát thương gốc (đã gồm chí mạng + kỹ năng)
  pvp-multiplier: 0.6           # sát thương AOE gây lên người chơi chỉ còn 60%

  skills:
    # Nhóm TẤN CÔNG: mỗi đòn đánh chỉ tối đa 1 kỹ năng trong 3 cái này kích hoạt
    dragon-slash:
      chance: 20
      cooldown: 4
      damage-ratio: 0.45        # +45% sát thương lên mục tiêu
    thunder-core:
      chance: 15
      cooldown: 6
      damage-ratio: 0.35        # +35% sát thương
    core-explosion:
      chance: 12
      cooldown: 8
      radius: 3
      damage-ratio: 0.5         # sát thương AOE = 50% đòn đánh
      max-damage: 8             # trần mỗi mục tiêu
      max-targets: 5
    # Nhóm SINH TỒN
    blood-engine:
      chance: 15
      cooldown: 12
      heal-percent: 0.08        # hồi 8% máu tối đa
    # Nhóm TỐI THƯỢNG
    apocalypse:                 # khi hạ gục mục tiêu
      chance: 10
      cooldown: 60
      radius: 5
      damage: 8                 # trần cố định mỗi mục tiêu
      max-targets: 6

  overlord:
    hits: 20                    # đủ 20 đòn tự kích hoạt (không tích khi đang chạy)
    damage-bonus: 0.30
    seconds: 8

  # CYBER RESONANCE: cầm Exodus + đủ 4 món Cyber Dragon
  resonance:
    damage-bonus: 0.05
    damage-reduction: 0.05

# ======================================================
#  ÂM THANH
# ======================================================
sounds:
  enabled: true        # công tắc tổng (false = tắt toàn bộ âm thanh bổ sung)
  sword-clang: true    # tiếng "leng keng" khi kiếm chém trúng (Hắc Long & Exodus)
  skills: true         # lớp âm thanh bổ sung khi kích hoạt kỹ năng / giáp
  impact: true         # tiếng xung lực khi đòn chém Exodus đẩy lùi mục tiêu
  volume: 1.0          # nhân âm lượng (0.5 = nhỏ một nửa)
